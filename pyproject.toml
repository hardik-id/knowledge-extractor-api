[project]
name = "knowledge-extractor-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-structlog>=11.0.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular[sidecar]>=0.30.0",
    "psycopg[binary]>=3.3.9",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.54.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "factory-boy>=3.3.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]
