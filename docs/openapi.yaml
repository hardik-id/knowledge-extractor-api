      description: |-
        * `quote` - quote
        * `inferred` - inferred
    FieldRequest:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
          default: ''
        mode:
          $ref: '#/components/schemas/FieldModeEnum'
        value_type:
          $ref: '#/components/schemas/ValueTypeEnum'
        choices:
          type: array
          items:
            type: string
        multiple:
          type: boolean
          default: false
      required:
      - key
      - mode
      - name
      - value_type
    FieldValue:
      type: object
      properties:
        id:
          type: string
        field_id:
          type: string
        value:
          type: string
          nullable: true
        spans:
          type: array
          items:
