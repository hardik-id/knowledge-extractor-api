{{- if .Values.serviceAccount.create }}
{{- /*
The identity of the api and the worker. With workloadIdentity.enabled the two
annotations tell Azure Workload Identity which user-assigned managed identity
the pods act as; the matching federated credential lives in Azure, not here
(docs/deploy.md, "Identity"). The migration Job does not use it.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knowledge-extractor.serviceAccountName" . }}
  labels:
    {{- include "knowledge-extractor.labels" . | nindent 4 }}
  {{- if or .Values.workloadIdentity.enabled .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.workloadIdentity.enabled }}
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
    {{- with .Values.workloadIdentity.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
