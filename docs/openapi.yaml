openapi: 3.0.3
info:
  title: Knowledge Extractor API
  version: v1
paths:
  /documents:
    get:
      operationId: documents_list
      description: The documents the signed-in person may open, newest first.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Substring of the name or location, any case.
      tags:
      - documents
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not signed in, or the token is refused.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Signed in, but not allowed to do this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the signed-in person.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid.
  /documents/{document_id}:
    get:
      operationId: documents_read
      description: The document as stored (UTF-8 Markdown, front matter included).
        The id contains slashes and may be percent-encoded. The `ETag` header is the
        `etag` of the list, quoted; `If-None-Match` with it answers 304.
      parameters:
      - in: path
        name: document_id
        schema:
          type: string
        required: true
      tags:
      - documents
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            text/markdown:
              schema:
                type: string
          description: ''
        '304':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not signed in, or the token is refused.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Signed in, but not allowed to do this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the signed-in person.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid.
  /health:
    get:
      operationId: health_retrieve
      description: The process is up. Never touches the database.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not signed in, or the token is refused.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Signed in, but not allowed to do this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the signed-in person.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid.
  /me:
    get:
      operationId: me_retrieve
      description: The signed-in person.
      tags:
      - me
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not signed in, or the token is refused.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Signed in, but not allowed to do this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the signed-in person.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid.
  /ready:
    get:
      operationId: ready_retrieve
      description: The service can reach its database.
      tags:
      - ready
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not signed in, or the token is refused.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Signed in, but not allowed to do this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the signed-in person.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid.
  /runs:
    post:
      operationId: runs_create
      description: Turn the picked documents into a run.
      tags:
      - runs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not signed in, or the token is refused.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Signed in, but not allowed to do this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the signed-in person.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid.
  /runs/{run_id}:
    get:
      operationId: runs_retrieve
      description: The whole state of a run (GET), or throw it away (DELETE).
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
        required: true
      tags:
      - runs
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not signed in, or the token is refused.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Signed in, but not allowed to do this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the signed-in person.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid.
    delete:
      operationId: runs_destroy
      description: The whole state of a run (GET), or throw it away (DELETE).
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
        required: true
      tags:
      - runs
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not signed in, or the token is refused.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Signed in, but not allowed to do this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the signed-in person.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid.
  /ws-ticket:
    post:
      operationId: ws_ticket_create
      description: A ticket to open a WebSocket as the signed-in person. Single use,
        short-lived.
      tags:
      - ws-ticket
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicket'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not signed in, or the token is refused.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Signed in, but not allowed to do this.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the signed-in person.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid.
components:
  schemas:
    CreateRunRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunItemRequest'
      required:
      - items
    Document:
      type: object
      description: A listed document, as the UI's parser reads it.
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
          readOnly: true
          default: storage
        type:
          type: string
        size_bytes:
          type: integer
        location:
          type: string
        modified_at:
          type: string
          format: date-time
        etag:
          type: string
      required:
      - etag
      - id
      - location
      - modified_at
      - name
      - size_bytes
      - source
      - type
    DocumentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
      required:
      - items
    Error:
      type: object
      description: The error body every non-2xx answer has. See docs/errors.md.
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable explanation.
        details:
          type: object
          additionalProperties: {}
          description: Extra information, such as one list per field.
      required:
      - code
      - message
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        preferred_username:
          type: string
          readOnly: true
      required:
      - id
      - name
      - preferred_username
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        files:
          readOnly: true
        cells:
          readOnly: true
      required:
      - cells
      - created_at
      - files
      - id
    RunItemRequest:
      type: object
      description: One chosen document. Only the source and its id count; the rest
        comes from the catalog.
      properties:
        source:
          type: string
          minLength: 1
        source_ref:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        size_bytes:
          type: integer
        location:
          type: string
        modified_at:
          type: string
          format: date-time
      required:
      - source
      - source_ref
    Status:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    WsTicket:
      type: object
      properties:
        ticket:
          type: string
          readOnly: true
          description: Single use. Valid for WS_TICKET_TTL_SECONDS. Goes in the socket
            URL as ?ticket=.
      required:
      - ticket
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An Entra ID access token (a dev token in local development).
servers:
- url: /api/v1
