          type: array
          items:
            $ref: '#/components/schemas/ValueInputRequest'
      required:
      - revision
      - values
    ReviewEnum:
      enum:
      - suggested
      - accepted
      - rejected
      type: string
      description: |-
        * `suggested` - Suggested
        * `accepted` - Accepted
        * `rejected` - Rejected
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        files:
          readOnly: true
        cells:
          readOnly: true
      required:
      - cells
      - created_at
      - files
      - id
    RunItemRequest:
      type: object
      description: One chosen document. Only the source and its id count; the rest
        comes from the catalog.
      properties:
        source:
          type: string
          minLength: 1
        source_ref:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        size_bytes:
          type: integer
        location:
          type: string
        modified_at:
          type: string
          format: date-time
      required:
      - source
      - source_ref
    SaveDefinitionRequest:
      type: object
      description: 'The body of a save: the draft plus the version it was edited from.'
      properties:
        prompt:
          type: string
        record_types:
          type: array
          items:
            $ref: '#/components/schemas/RecordTypeRequest'
        output:
          $ref: '#/components/schemas/OutputRequest'
        chunking:
          allOf:
          - $ref: '#/components/schemas/ChunkingRequest'
          description: 'Left out: the new version keeps the chunking of the latest
            version.'
        base_version:
          type: integer
          minimum: 1
        note:
          type: string
          maxLength: 200
      required:
      - base_version
      - output
      - prompt
      - record_types
    SendMessageRequest:
      type: object
      description: 'The body of a POST: what the person wrote and the draft on their
        screen.'
      properties:
        text:
          type: string
        definition:
          $ref: '#/components/schemas/DraftRequest'
      required:
      - definition
      - text
    SetWorkspaceRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/SetWorkspaceRoleRoleEnum'
      required:
      - role
    SetWorkspaceRoleRoleEnum:
      enum:
      - owner
      - editor
      - viewer
      type: string
      description: |-
        * `owner` - owner
        * `editor` - editor
        * `viewer` - viewer
    Span:
      type: object
      properties:
        start:
          type: integer
        end:
          type: integer
        quote:
          type: string
      required:
      - end
      - quote
      - start
    SpanInputRequest:
      type: object
      description: 'A span a person sends: the quote is kept as sent, so it can equal
        the text.'
      properties:
        start:
          type: integer
        end:
          type: integer
        quote:
          type: string
      required:
      - end
      - quote
      - start
    StartExecutionRequest:
      type: object
      description: 'The body of ``POST .../stages/extract/executions``. No ``file_ids``:
        every file.'
      properties:
        file_ids:
          type: array
          items:
            type: string
            minLength: 1
          nullable: true
        config:
          $ref: '#/components/schemas/ExecutionConfigRequest'
    StateEnum:
      enum:
      - stub
      - ok
      - failing
      - unknown
      type: string
      description: |-
        * `stub` - stub
        * `ok` - ok
        * `failing` - failing
        * `unknown` - unknown
    Status:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    StatusEnum:
      enum:
      - streaming
      - done
      type: string
      description: |-
        * `streaming` - Streaming
        * `done` - Done
    StrategyEnum:
      enum:
      - auto
      - heading
      - paragraph
      - fixed
      - custom
      type: string
      description: |-
        * `auto` - auto
        * `heading` - heading
        * `paragraph` - paragraph
        * `fixed` - fixed
        * `custom` - custom
    Template:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        definition:
          $ref: '#/components/schemas/Draft'
      required:
      - definition
      - description
      - id
      - name
    TemplateList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        next:
          type: string
          nullable: true
      required:
      - items
      - next
    TenantMember:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          type: string
          readOnly: true
        added_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - added_at
      - role
      - user
    TenantMemberList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantMember'
        next:
          type: string
          nullable: true
      required:
      - items
      - next
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        preferred_username:
          type: string
          readOnly: true
      required:
      - id
      - name
      - preferred_username
    UserList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next:
          type: string
          nullable: true
      required:
      - items
      - next
    ValueInputRequest:
      type: object
      properties:
        value:
          type: string
          nullable: true
        spans:
          type: array
          items:
            $ref: '#/components/schemas/SpanInputRequest'
      required:
      - spans
      - value
    ValueTypeEnum:
      enum:
      - text
      - date
      - number
      - choice
      type: string
      description: |-
        * `text` - text
        * `date` - date
        * `number` - number
        * `choice` - choice
    Workspace:
      type: object
      description: A workspace on the wire. Read from the annotated queryset of the
        selectors.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        run_id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          description: The person's permission names in this workspace, sorted.
          readOnly: true
        document_count:
          type: integer
          readOnly: true
        configuration_version:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - configuration_version
      - created_at
      - document_count
      - id
      - name
      - permissions
      - role
      - run_id
      - tenant_id
      - updated_at
    WorkspaceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        next:
          type: string
          nullable: true
      required:
      - items
      - next
    WorkspaceMember:
      type: object
      description: A person's role in a workspace on the wire.
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          readOnly: true
        role:
          type: string
          readOnly: true
        added_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - added_at
      - role
      - user
    WorkspaceMemberList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
          readOnly: true
      required:
      - items
    WsTicket:
      type: object
      properties:
        ticket:
          type: string
          readOnly: true
          description: Single use. Valid for WS_TICKET_TTL_SECONDS. Goes in the socket
            URL as ?ticket=.
      required:
      - ticket
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An Entra ID access token (a dev token in local development).
servers:
- url: /api/v1
