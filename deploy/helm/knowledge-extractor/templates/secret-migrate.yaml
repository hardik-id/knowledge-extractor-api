{{- if not .Values.secrets.existingSecret }}
{{- /* The migration Job's own copy of the chart-made Secret, a hook for the reason given in configmap-migrate.yaml. With existingSecret the Job reads that Secret. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knowledge-extractor.migrateSecretName" . }}
  labels:
    {{- include "knowledge-extractor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- include "knowledge-extractor.secretData" . | nindent 2 }}
{{- end }}
