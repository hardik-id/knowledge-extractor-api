components:
  schemas:
    AddRecordRequest:
      type: object
      description: The body of ``POST .../records``.
      properties:
        revision:
          type: integer
          minimum: 0
        record_type_id:
          type: string
          minLength: 1
        span:
          allOf:
          - $ref: '#/components/schemas/SpanInputRequest'
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldInputRequest'
      required:
      - record_type_id
      - revision
      - span
    AddTenantMemberRequest:
      type: object
      description: A sign-in name; a platform admin may give ``user_id`` instead.
      properties:
        preferred_username:
          type: string
          minLength: 1
          maxLength: 255
        user_id:
          type: integer
          maximum: 2147483647
          minimum: 1
        role:
          type: string
          minLength: 1
      required:
      - role
    BackendStatus:
      type: object
      properties:
        environment:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Part'
      required:
      - environment
      - parts
    ChangeTenantRoleRequest:
      type: object
      properties:
        role:
          type: string
          minLength: 1
      required:
      - role
    Chunking:
      type: object
      description: |-
        How a long document is cut into parts. ``size`` is null for ``auto``.

        ``custom`` is an object only for the ``custom`` strategy, otherwise null.
      properties:
        strategy:
          allOf:
          - $ref: '#/components/schemas/StrategyEnum'
          default: auto
        size:
          type: integer
          nullable: true
        custom:
          allOf:
          - $ref: '#/components/schemas/CustomChunking'
          nullable: true
    ChunkingRequest:
      type: object
      description: |-
        How a long document is cut into parts. ``size`` is null for ``auto``.

        ``custom`` is an object only for the ``custom`` strategy, otherwise null.
      properties:
        strategy:
          allOf:
          - $ref: '#/components/schemas/StrategyEnum'
          default: auto
        size:
          type: integer
          nullable: true
        custom:
          allOf:
          - $ref: '#/components/schemas/CustomChunkingRequest'
          nullable: true
    CreateRunRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunItemRequest'
      required:
      - items
    CreateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        template_id:
          type: string
          minLength: 1
        tenant_id:
          type: string
          format: uuid
      required:
      - name
    CustomChunking:
      type: object
      description: The splitting code a sandbox agent wrote for the ``custom`` strategy.
      properties:
        instruction:
          type: string
          maxLength: 2000
        source_url:
          type: string
          nullable: true
          maxLength: 2000
        code:
          type: string
          maxLength: 20000
        summary:
          type: string
          default: ''
          maxLength: 1000
      required:
      - code
      - instruction
    CustomChunkingRequest:
      type: object
      description: The splitting code a sandbox agent wrote for the ``custom`` strategy.
      properties:
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
        source_url:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
        code:
          type: string
          minLength: 1
          maxLength: 20000
        summary:
          type: string
          default: ''
          maxLength: 1000
      required:
      - code
      - instruction
    Definition:
      type: object
      properties:
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        prompt:
          type: string
        record_types: {}
        output: {}
        chunking:
          allOf:
          - $ref: '#/components/schemas/Chunking'
          readOnly: true
        note:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chunking
      - created_at
      - output
      - prompt
      - record_types
      - version
    DefinitionVersionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionVersionSummary'
      required:
      - items
    DefinitionVersionSummary:
      type: object
      properties:
        version:
          type: integer
        note:
          type: string
        created_at:
          type: string
          format: date-time
        record_type_count:
          type: integer
        field_count:
          type: integer
      required:
      - created_at
      - field_count
      - note
      - record_type_count
      - version
    Document:
      type: object
      description: A listed document, as the UI's parser reads it.
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
          readOnly: true
          default: storage
        type:
          type: string
        size_bytes:
          type: integer
        location:
          type: string
        modified_at:
          type: string
          format: date-time
        etag:
          type: string
      required:
      - etag
      - id
      - location
      - modified_at
      - name
      - size_bytes
      - source
      - type
    DocumentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
      required:
      - items
    Draft:
      type: object
      description: 'A definition in an answer: ``chunking`` is always there.'
      properties:
        prompt:
          type: string
        record_types:
          type: array
          items:
            $ref: '#/components/schemas/RecordType'
        output:
          $ref: '#/components/schemas/Output'
        chunking:
          $ref: '#/components/schemas/Chunking'
      required:
      - chunking
      - output
      - prompt
      - record_types
    DraftRequest:
      type: object
      description: A definition without ``version`` and ``base_version``.
      properties:
        prompt:
          type: string
        record_types:
          type: array
          items:
            $ref: '#/components/schemas/RecordTypeRequest'
        output:
          $ref: '#/components/schemas/OutputRequest'
        chunking:
          $ref: '#/components/schemas/ChunkingRequest'
      required:
      - output
      - prompt
      - record_types
    Error:
      type: object
      description: The error body every non-2xx answer has. See docs/errors.md.
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable explanation.
        details:
          type: object
          additionalProperties: {}
          description: Extra information, such as one list per field.
      required:
      - code
      - message
    Execution:
      type: object
      properties:
        execution_id:
          type: string
        stage:
          type: string
        file_ids:
          type: array
          items:
            type: string
      required:
      - execution_id
      - file_ids
      - stage
    ExecutionConfigRequest:
      type: object
      description: The stage settings of an execution. ``definitionVersion`` is accepted
        too.
      properties:
        definition_version:
          type: integer
          minimum: 1
    Extraction:
      type: object
      description: 'The whole extraction of a file: what the read answers and every
        write will.'
      properties:
        file_id:
          type: string
        revision:
          type: integer
        source_etag:
          type: string
        definition_version:
          type: integer
        records:
          type: array
          items:
            $ref: '#/components/schemas/Record'
      required:
      - definition_version
      - file_id
      - records
      - revision
      - source_etag
    Field:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
          default: ''
        mode:
          $ref: '#/components/schemas/FieldModeEnum'
        value_type:
          $ref: '#/components/schemas/ValueTypeEnum'
        choices:
          type: array
          items:
            type: string
        multiple:
          type: boolean
          default: false
      required:
      - key
      - mode
      - name
      - value_type
    FieldInputRequest:
      type: object
      properties:
        field_id:
          type: string
          minLength: 1
        values:
          type: array
          items:
            $ref: '#/components/schemas/ValueInputRequest'
      required:
      - field_id
      - values
    FieldModeEnum:
      enum:
      - quote
