{{- if not .Values.secrets.existingSecret }}
{{- /* Only when no existingSecret is named; a hook for the reason given in configmap.yaml. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knowledge-extractor.secretName" . }}
  labels:
    {{- include "knowledge-extractor.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- range $key := splitList "," (include "knowledge-extractor.secretKeys" .) }}
  {{ $key }}: {{ get $.Values.secrets.values $key | toString | quote }}
  {{- end }}
{{- end }}
