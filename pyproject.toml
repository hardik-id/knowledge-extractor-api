[project]
name = "knowledge-extractor-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.27.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-structlog>=11.0.0",
    "django-tasks-db>=0.13.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular[sidecar]>=0.30.0",
    "openai-agents>=0.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-asgi>=0.66b2",
    "opentelemetry-instrumentation-django>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.54.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "factory-boy>=3.3.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]
