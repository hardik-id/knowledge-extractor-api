apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-extractor.fullname" . }}-api
  labels:
    {{- include "knowledge-extractor.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "knowledge-extractor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
