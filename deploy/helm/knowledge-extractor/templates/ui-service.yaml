{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-extractor.fullname" . }}-ui
  labels:
    {{- include "knowledge-extractor.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "knowledge-extractor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
