components:
  schemas:
    AddRecordRequest:
      type: object
      description: The body of ``POST .../records``.
      properties:
        revision:
          type: integer
          minimum: 0
        record_type_id:
          type: string
          minLength: 1
        span:
          allOf:
          - $ref: '#/components/schemas/SpanInputRequest'
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldInputRequest'
      required:
      - record_type_id
      - revision
      - span
    CreateRunRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunItemRequest'
      required:
      - items
    Definition:
      type: object
      properties:
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        prompt:
          type: string
        record_types: {}
        output: {}
      required:
      - output
      - prompt
      - record_types
      - version
    Document:
      type: object
      description: A listed document, as the UI's parser reads it.
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
          readOnly: true
          default: storage
        type:
          type: string
        size_bytes:
          type: integer
        location:
          type: string
        modified_at:
          type: string
          format: date-time
        etag:
          type: string
      required:
      - etag
      - id
      - location
      - modified_at
      - name
      - size_bytes
      - source
      - type
    DocumentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
      required:
      - items
    Error:
      type: object
      description: The error body every non-2xx answer has. See docs/errors.md.
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable explanation.
        details:
          type: object
          additionalProperties: {}
          description: Extra information, such as one list per field.
      required:
      - code
      - message
    Extraction:
      type: object
      description: 'The whole extraction of a file: what the read answers and every
        write will.'
      properties:
        file_id:
          type: string
        revision:
          type: integer
        source_etag:
          type: string
        definition_version:
          type: integer
        records:
          type: array
          items:
            $ref: '#/components/schemas/Record'
      required:
      - definition_version
      - file_id
      - records
      - revision
      - source_etag
    FieldInputRequest:
      type: object
      properties:
        field_id:
          type: string
          minLength: 1
        values:
          type: array
          items:
            $ref: '#/components/schemas/ValueInputRequest'
      required:
      - field_id
      - values
    FieldRequest:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
          default: ''
        mode:
          $ref: '#/components/schemas/ModeEnum'
        value_type:
          $ref: '#/components/schemas/ValueTypeEnum'
        choices:
          type: array
          items:
            type: string
        multiple:
          type: boolean
          default: false
      required:
      - key
      - mode
      - name
      - value_type
    FieldValue:
      type: object
      properties:
        id:
          type: string
        field_id:
          type: string
        value:
          type: string
          nullable: true
        spans:
          type: array
          items:
            $ref: '#/components/schemas/Span'
        origin:
          $ref: '#/components/schemas/OriginEnum'
        review:
          $ref: '#/components/schemas/ReviewEnum'
        anchored:
          type: boolean
      required:
      - anchored
      - field_id
      - id
      - origin
      - review
      - spans
      - value
    FormatEnum:
      enum:
      - json
      - markdown
      - csv
      type: string
      description: |-
        * `json` - json
        * `markdown` - markdown
        * `csv` - csv
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        preferred_username:
          type: string
          readOnly: true
      required:
      - id
      - name
      - preferred_username
    ModeEnum:
      enum:
      - quote
      - inferred
      type: string
      description: |-
        * `quote` - quote
        * `inferred` - inferred
    OriginEnum:
      enum:
      - llm
      - human
      type: string
      description: |-
        * `llm` - Llm
        * `human` - Human
    OutputRequest:
      type: object
      properties:
        format:
          $ref: '#/components/schemas/FormatEnum'
        template:
          type: string
      required:
      - format
      - template
    PatchedReviewValueRequest:
      type: object
      description: The body of ``PATCH .../records/{record_id}/values/{value_id}``.
      properties:
        revision:
          type: integer
          minimum: 0
        review:
          $ref: '#/components/schemas/ReviewEnum'
    PatchedUpdateRecordRequest:
      type: object
      description: 'The body of ``PATCH .../records/{record_id}``: only the keys sent
        change.'
      properties:
        revision:
          type: integer
          minimum: 0
        review:
          $ref: '#/components/schemas/ReviewEnum'
        span:
          allOf:
          - $ref: '#/components/schemas/SpanInputRequest'
          nullable: true
        use_as_example:
          type: boolean
    Record:
      type: object
      properties:
        id:
          type: string
        file_id:
          type: string
        record_type_id:
          type: string
        span:
          allOf:
          - $ref: '#/components/schemas/Span'
          nullable: true
        origin:
          $ref: '#/components/schemas/OriginEnum'
        review:
          $ref: '#/components/schemas/ReviewEnum'
        use_as_example:
          type: boolean
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldValue'
      required:
      - fields
      - file_id
      - id
      - origin
      - record_type_id
      - review
      - span
      - use_as_example
    RecordTypeRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          default: ''
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldRequest'
      required:
      - fields
      - name
    ReplaceFieldValuesRequest:
      type: object
      description: The body of ``PUT .../records/{record_id}/fields/{field_id}``.
      properties:
        revision:
          type: integer
          minimum: 0
        values:
          type: array
          items:
            $ref: '#/components/schemas/ValueInputRequest'
      required:
      - revision
      - values
    ReviewEnum:
      enum:
      - suggested
      - accepted
      - rejected
      type: string
      description: |-
        * `suggested` - Suggested
        * `accepted` - Accepted
        * `rejected` - Rejected
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        files:
          readOnly: true
        cells:
          readOnly: true
      required:
      - cells
      - created_at
      - files
      - id
    RunItemRequest:
      type: object
      description: One chosen document. Only the source and its id count; the rest
        comes from the catalog.
      properties:
        source:
          type: string
          minLength: 1
        source_ref:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        size_bytes:
          type: integer
        location:
          type: string
        modified_at:
          type: string
          format: date-time
      required:
      - source
      - source_ref
    SaveDefinitionRequest:
      type: object
      description: 'The body of a save: the draft plus the version it was edited from.'
      properties:
        prompt:
          type: string
        record_types:
          type: array
          items:
            $ref: '#/components/schemas/RecordTypeRequest'
        output:
          $ref: '#/components/schemas/OutputRequest'
        base_version:
          type: integer
          minimum: 1
      required:
      - base_version
      - output
      - prompt
      - record_types
    Span:
      type: object
      properties:
        start:
          type: integer
        end:
          type: integer
        quote:
          type: string
      required:
      - end
      - quote
      - start
    SpanInputRequest:
      type: object
      description: 'A span a person sends: the quote is kept as sent, so it can equal
        the text.'
      properties:
        start:
          type: integer
        end:
          type: integer
        quote:
          type: string
      required:
      - end
      - quote
      - start
    Status:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    ValueInputRequest:
      type: object
      properties:
        value:
          type: string
          nullable: true
        spans:
          type: array
          items:
            $ref: '#/components/schemas/SpanInputRequest'
      required:
      - spans
      - value
    ValueTypeEnum:
      enum:
      - text
      - date
      - number
      - choice
      type: string
      description: |-
        * `text` - text
        * `date` - date
        * `number` - number
        * `choice` - choice
    WsTicket:
      type: object
      properties:
        ticket:
          type: string
          readOnly: true
          description: Single use. Valid for WS_TICKET_TTL_SECONDS. Goes in the socket
            URL as ?ticket=.
      required:
      - ticket
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An Entra ID access token (a dev token in local development).
servers:
- url: /api/v1
