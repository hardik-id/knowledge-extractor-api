{{- /*
The database migration. A hook: it runs, and must succeed, before the new
version is installed or upgraded, so a failed migration leaves the running
version serving. It reads its own hook copies of the ConfigMap and the
Secret (configmap-migrate.yaml, secret-migrate.yaml). It needs no Azure
identity (the database URL is in the Secret), so it runs as the namespace's default ServiceAccount without a token,
except with Key Vault: the driver signs in with the chart's ServiceAccount, so the Job runs as it and mounts the volume that syncs the Secret.
With the dev PostgreSQL or Key Vault the hook runs after the install (migrateHook in _helpers.tpl) and waits for the database.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "knowledge-extractor.fullname" . }}-migrate
  labels:
    {{- include "knowledge-extractor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": {{ include "knowledge-extractor.migrateHook" . }}
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "knowledge-extractor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
        {{- if .Values.keyVault.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      restartPolicy: Never
      {{- if .Values.keyVault.enabled }}
      serviceAccountName: {{ include "knowledge-extractor.serviceAccountName" . }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        # A first install starts the database at the same time: wait until it answers.
        - name: wait-for-database
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "knowledge-extractor.postgresName" . }} -p 5432 -U {{ .Values.postgres.user | quote }} -d {{ .Values.postgres.database | quote }}; do echo waiting for the database; sleep 3; done
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "knowledge-extractor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "knowledge-extractor.fullname" . }}-migrate
            - secretRef:
                name: {{ include "knowledge-extractor.migrateSecretName" . }}
          {{- with include "knowledge-extractor.dependencyEnv" . | trim }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.keyVault.enabled }}
            {{- include "knowledge-extractor.keyVaultMount" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.keyVault.enabled }}
        {{- include "knowledge-extractor.keyVaultVolume" . | nindent 8 }}
        {{- end }}
