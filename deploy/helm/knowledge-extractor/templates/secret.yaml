{{- if not .Values.secrets.existingSecret }}
{{- /* Only when no existingSecret is named. An ordinary resource of the release; the migration Job reads its hook copy (secret-migrate.yaml). */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knowledge-extractor.secretName" . }}
  labels:
    {{- include "knowledge-extractor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "knowledge-extractor.secretData" . | nindent 2 }}
{{- end }}
