          type: string
        description: Substring of the name or location, any case.
      tags:
      - documents
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
          description: ''
        '401':
