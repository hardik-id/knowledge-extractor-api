# The dev environment of the AKS cluster. Every value marked REPLACE or
# 00000000-... is a placeholder to fill in before a real deployment.
# No secret is written here: the Secret comes from secrets.existingSecret
# (or --set-file for a first try), see docs/deploy.md.

image:
  # Placeholder: the container registry of the dev environment.
  repository: replace-me.azurecr.io/knowledge-extractor-api
  tag: replace-with-a-version

serviceAccount:
  # Fixed, so the federated credential in Azure can name it:
  # system:serviceaccount:<namespace>:knowledge-extractor
  name: knowledge-extractor

workloadIdentity:
  enabled: true
  # Placeholders: the client id of the user-assigned managed identity, and the Entra tenant.
  clientId: 00000000-0000-0000-0000-000000000000
  tenantId: 00000000-0000-0000-0000-000000000000

config:
  # DJANGO_ALLOWED_HOSTS and CORS_ALLOWED_ORIGINS follow from ingress.host; set them here only to override.
  # Placeholders: the Entra app registration of the UI and API.
  ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
  ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
  API_DOCS_ENABLED: "true"
  # The catalog and the storage are still the samples; the account URL is ready for the azure storage.
  AZURE_STORAGE_ACCOUNT_URL: https://replacemestorage.blob.core.windows.net
  # The assistant uses Azure OpenAI through the pod's managed identity: no key.
  ASSISTANT_AGENT: openai
  LLM_PROVIDER: azure
  LLM_MODEL: replace-with-the-deployment-name
  AZURE_OPENAI_ENDPOINT: https://replace-me.openai.azure.com
  # Telemetry stays off until the cluster's collector exists; then set
  # OTEL_SDK_DISABLED to "false" and OTEL_LOGS_EXPORTER to otlp.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev

# Key Vault: off until the vault exists. Then fill these, set enabled to true
# (or --set keyVault.enabled=true) and the Secret is synced from the vault.
# Not used with postgres or redis below: the URLs then come from the vault.
keyVault:
  enabled: false
  keyvaultName: replace-me-keyvault
  objects:
    DJANGO_SECRET_KEY: ke-django-secret-key
    DATABASE_URL: ke-database-url
    REDIS_URL: ke-redis-url
    OPENAI_API_KEY: ke-openai-api-key

# For dev only: no backups, one replica. Switch off when the dev environment
# has a real PostgreSQL and Redis. The passwords are generated on the first install.
postgres:
  enabled: true
redis:
  enabled: true

ui:
  image:
    # Placeholders: the registry and the tag of the UI image (built for this host, see the README).
    repository: replace-me.azurecr.io/knowledge-extractor-ui
    tag: replace-with-a-version

ingress:
  enabled: true
  className: nginx
  # Placeholder: the one host of the UI and the API. The UI image must be built for it.
  host: dev.replace-me.example
  annotations:
    # The WebSocket (/ws) must survive: ingress-nginx closes an idle connection after
    # 60 s by default. Raise the read and send timeouts (seconds). Other controllers
    # need their own settings (Application Gateway: the request timeout of the backend setting).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # TLS with cert-manager (when installed): name the issuer, and give tls.secretName
    # for the certificate to be stored in.
    # cert-manager.io/cluster-issuer: replace-with-the-issuer
  tls:
    # Placeholder: the Secret that holds the certificate for the host.
    secretName: knowledge-extractor-dev-tls

# secrets: not set here, on purpose. Name an existing Secret in the namespace with
# DJANGO_SECRET_KEY (with postgres and redis above, DATABASE_URL and REDIS_URL are
# not needed in it): --set secrets.existingSecret=<name>. Without a source the chart
# refuses to render.
