{{- if .Values.ingress.enabled }}
{{- /*
One host, one origin: /api and /ws go to the api Service, everything else to
the ui Service (or nowhere, with ui.enabled=false). TLS ends here; the
controller sends X-Forwarded-Proto, which the production settings trust.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "knowledge-extractor.fullname" . }}
  labels:
    {{- include "knowledge-extractor.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "knowledge-extractor.fullname" . }}-api
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "knowledge-extractor.fullname" . }}-api
                port:
                  name: http
          {{- if .Values.ui.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "knowledge-extractor.fullname" . }}-ui
                port:
                  name: http
          {{- end }}
{{- end }}
