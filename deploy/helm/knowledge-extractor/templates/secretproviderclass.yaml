{{- if .Values.keyVault.enabled }}
{{- /*
Placeholder for Azure Key Vault, off until the vault exists (keyVault.enabled).
A SecretProviderClass of the Azure provider of the Secrets Store CSI driver
(the AKS add-on, secrets-store-csi-driver and its Azure provider). It signs in
with the workload identity of the chart's ServiceAccount (clientID, tenantId)
and, through secretObjects, syncs the vault's secrets into the Kubernetes
Secret the pods read. The driver syncs only while a pod mounts the volume:
api, worker and the migration Job mount it. Rendering needs the driver's CRD
in the cluster, which is why this file is skipped when the feature is off.
docs/deploy.md, "Secrets from Key Vault".
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "knowledge-extractor.fullname" . }}
  labels:
    {{- include "knowledge-extractor.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ include "knowledge-extractor.keyVaultClientId" . | quote }}
    tenantId: {{ include "knowledge-extractor.keyVaultTenantId" . | quote }}
    keyvaultName: {{ .Values.keyVault.keyvaultName | quote }}
    objects: |
      array:
        {{- range $key := splitList "," (include "knowledge-extractor.secretKeys" .) }}
        - |
          objectName: {{ get $.Values.keyVault.objects $key }}
          objectType: secret
          objectAlias: {{ $key }}
        {{- end }}
  secretObjects:
    - secretName: {{ include "knowledge-extractor.secretName" . }}
      type: Opaque
      data:
        {{- range $key := splitList "," (include "knowledge-extractor.secretKeys" .) }}
        - objectName: {{ $key }}
          key: {{ $key }}
        {{- end }}
{{- end }}
