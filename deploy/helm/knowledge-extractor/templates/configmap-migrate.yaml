{{- /*
The migration Job's own copy of the settings: a hook, created before the Job
(weight -10) and removed once it succeeded. The release's ConfigMap does not
exist yet on a first install, and on an upgrade it must not change before the
migration has succeeded. docs/deploy.md, "Migration".
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "knowledge-extractor.fullname" . }}-migrate
  labels:
    {{- include "knowledge-extractor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": {{ include "knowledge-extractor.migrateHook" . }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  {{- include "knowledge-extractor.configData" . | nindent 2 }}
